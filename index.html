<style>
:root{--navy:#1F2A44;--accent:#3E63DD;--accent-dark:#2F4EC0;--accent-light:#EEF2FF;--danger:#E1483E;--border:#E3E6EC;--bg:#F4F6FB;--surface:#fff;--text-mute:#6B7280;--text-faint:#9AA2B1;--shadow-md:0 6px 16px rgba(16,24,40,.08)}
:root[data-theme="dark"]{--bg:#0E121B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
.overlay-screen{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#2B3A5E 0%,#161E33 100%);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;overflow-y:auto}
.overlay-screen.show{display:flex}
.login-card{background:var(--surface);width:340px;max-width:100%;border-radius:16px;padding:0 0 30px 0;box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:center;overflow:hidden}
.login-accent{height:6px;background:linear-gradient(90deg,var(--accent) 0%,#7C93F0 100%)}
.login-mark{width:52px;height:52px;margin:26px auto 14px auto;border-radius:14px;background:linear-gradient(135deg,var(--accent) 0%,#7C93F0 100%);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;box-shadow:var(--shadow-md)}
.login-card h1{font-size:21px;font-weight:800;color:var(--navy);letter-spacing:-.3px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--text-faint);margin-bottom:24px;font-weight:500}
.login-field{text-align:left;margin:0 30px 12px 30px}
.login-field label{display:block;font-size:11px;font-weight:700;color:var(--text-mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.login-field input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;font-family:inherit;height:40px;color:#1D2433;background:#fff}
.login-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.login-remember{display:flex;align-items:center;gap:7px;margin:0 30px 16px 30px}
.login-remember input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.login-remember label{font-size:12.5px;color:var(--text-mute);font-weight:600;cursor:pointer;user-select:none}
.login-btn{width:calc(100% - 60px);margin:6px 30px 0 30px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:hover{background:var(--accent-dark)}
.login-btn:disabled{opacity:.6;cursor:default}
.login-error{color:var(--danger);font-size:12px;margin-top:12px;min-height:15px;font-weight:600;padding:0 20px}
#appframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:transparent}
.safe-bottom{position:fixed;left:0;right:0;bottom:0;height:env(safe-area-inset-bottom,0px);background:#1F2A44;display:none}
@media (max-width:860px){.safe-bottom{display:block}}
</style>
</head>
<body>
<div class="overlay-screen" id="login-screen">
  <div class="login-card">
    <div class="login-accent"></div>
    <div class="login-mark">a</div>
    <h1>aionio</h1>
    <div class="login-sub">로그인 후 이용해주세요</div>
    <div class="login-field"><label>이메일</label>
      <input type="email" id="login_email" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login_pw').focus()"></div>
    <div class="login-field"><label>비밀번호</label>
      <input type="password" id="login_pw" autocomplete="current-password" onkeydown="if(event.key==='Enter')__gateLogin()"></div>
    <div class="login-remember"><input type="checkbox" id="login_remember"><label for="login_remember">아이디 저장</label></div>
    <button class="login-btn" id="login_btn" onclick="__gateLogin()">로그인</button>
    <div class="login-error" id="login_error"></div>
  </div>
</div>
<div class="safe-bottom"></div>

  var $ = function (id) { return document.getElementById(id); };
  var ERR = {
    'auth/invalid-email': '이메일 형식이 올바르지 않습니다.',
    'auth/user-disabled': '사용이 중지된 계정입니다.',
    'auth/user-not-found': '이메일 또는 비밀번호가 올바르지 않습니다.',
    'auth/wrong-password': '이메일 또는 비밀번호가 올바르지 않습니다.',

  };
  var TIMEOUT = 5 * 60 * 1000, KEYSTORE = 'aionio_k';
  var frame = null, opening = false, auth, db;

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function decrypt(keyB64) {
    var raw = b64(PAYLOAD);
    var key = await crypto.subtle.importKey('raw', b64(keyB64), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return new TextDecoder().decode(pt);
  }
  function expired() {
    try { var last = Number(localStorage.getItem('aionio_last_active')); return !!last && (Date.now() - last) > TIMEOUT; }
    catch (e) { return false; }
  }
  function showLogin(msg) {
    if (frame) { frame.remove(); frame = null; }
    $('login-screen').classList.add('show');
    $('login_error').textContent = msg || '';
    $('login_pw').value = '';
    var b = $('login_btn'); b.disabled = false; b.textContent = '로그인';
  }
  async function fetchKey() {
    try {
      var d = await db.collection('config').doc('appkey').get();
      var k = d.exists ? d.data().k : null;
      if (k) { try { localStorage.setItem(KEYSTORE, k); } catch (e) {} return k; }
    } catch (e) { /* 아래에서 저장된 값으로 대체 */ }
    try { return localStorage.getItem(KEYSTORE); } catch (e) { return null; }
  }
  async function open() {
    if (frame || opening) return;
    opening = true;
    try {
      var k = await fetchKey();
      if (!k) { showLogin('접근할 수 없습니다. 관리자에게 문의해주세요.'); auth.signOut(); return; }
      var html = await decrypt(k);
      $('login-screen').classList.remove('show');
      frame = document.createElement('iframe');
      frame.id = 'appframe';
      frame.setAttribute('title', 'aionio');
      frame.srcdoc = html;
      document.body.appendChild(frame);
    } catch (e) {
      showLogin('접근할 수 없습니다. 관리자에게 문의해주세요.');
      try { localStorage.removeItem(KEYSTORE); } catch (e2) {}
      auth.signOut();
    } finally { opening = false; }
  }
  function lock() {
    try { localStorage.removeItem(KEYSTORE); } catch (e) {}
    showLogin('');
  }
  window.__gateLogin = async function () {
    var email = $('login_email').value.trim(), pw = $('login_pw').value;
    var err = $('login_error'), btn = $('login_btn');
    if (!email || !pw) { err.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
    try {
      if ($('login_remember').checked) localStorage.setItem('aionio_saved_email', email);
      else localStorage.removeItem('aionio_saved_email');
    } catch (e) {}
    err.textContent = ''; btn.disabled = true; btn.textContent = '로그인 중...';
    try { await auth.signInWithEmailAndPassword(email, pw); }
    catch (e) {
      err.textContent = ERR[e.code] || ('로그인에 실패했습니다. (' + e.code + ')');
      $('login_pw').value = ''; $('login_pw').focus();
      btn.disabled = false; btn.textContent = '로그인';
    }
  };

  window.addEventListener('message', function (e) {
    if (frame && e.source === frame.contentWindow && e.data && e.data.aionio === 'signedout') lock();
  });

  try { var se = localStorage.getItem('aionio_saved_email'); if (se) { $('login_email').value = se; $('login_remember').checked = true; } } catch (e) {}

    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function (reg) {

    }).catch(function () {});
    var had = !!navigator.serviceWorker.controller, rl = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {

      rl = true; location.reload();
    });
  }

  firebase.initializeApp(CFG);
  auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(function (user) {
    if (user) {
      if (expired()) { try { localStorage.removeItem('aionio_last_active'); } catch (e) {} auth.signOut(); return; }
      open();
    } else {
      lock();
      setTimeout(function () { var el = $('login_email'); if (el && !el.value) el.focus(); }, 100);
    }
  });
